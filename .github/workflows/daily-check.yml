name: 每日 LOF 关注检查

on:
  # 由 Windows 任务计划程序调用；不使用可能延迟的 GitHub schedule
  workflow_dispatch:
    inputs:
      top:
        description: '检查前N只基金'
        default: '15'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 LOF 关注检查并推送微信
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          PYTHONUTF8: 1
          TOP_N: ${{ github.event.inputs.top || '15' }}
        run: |
          python tools/run_check.py --top "$TOP_N" --push-key "$SCT_SENDKEY"
