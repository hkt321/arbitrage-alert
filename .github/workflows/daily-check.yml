name: 每日 LOF 关注检查

on:
  # 每天北京时间 13:17 (UTC 05:17) 自动运行，工作日；避开 GitHub Actions 整点高峰
  schedule:
    - cron: '17 5 * * 1-5'
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      top:
        description: '检查前N只基金'
        default: '30'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查计划推送窗口
        id: schedule_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_bjt=$(TZ=Asia/Shanghai date +%H%M)
          if (( 10#$current_bjt >= 1300 && 10#$current_bjt <= 1450 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "北京时间 ${current_bjt} 已超出 13:00-14:50 推送窗口，本次跳过"
          fi

      - name: 安装 Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: 运行 LOF 关注检查并推送微信
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          PYTHONUTF8: 1
          TOP_N: ${{ github.event.inputs.top || '30' }}
        run: |
          python tools/run_check.py --top "$TOP_N" --push-key "$SCT_SENDKEY"
