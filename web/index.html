<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>套利机会提醒神器</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>套利机会提醒神器</h1>
          <p id="updatedAt">等待刷新</p>
        </div>
        <section class="threshold-panel" aria-label="刷新控制">
          <button id="refreshButton" class="primary-action" type="button">刷新</button>
          <label>
            自动刷新
            <input id="autoRefresh" type="checkbox" />
          </label>
          <label>
            间隔
            <input id="refreshInterval" type="number" value="60" min="15" step="15" />
            <span>秒</span>
          </label>
        </section>
      </header>

      <nav class="tabs" aria-label="机会分类">
        <button class="active" data-category="全部">全部</button>
        <button data-category="可执行">可执行</button>
        <button data-category="观察">观察</button>
        <button data-category="普通">普通</button>
        <button data-category="不可用">不可用</button>
        <button data-category="自选">自选</button>
      </nav>

      <section class="toolbar">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="名称或代码" />
        </label>
        <div class="summary" id="summary"></div>
      </section>

      <section class="table-wrap" aria-label="套利机会列表">
        <table>
          <thead>
            <tr>
              <th data-sort="name">基金名称</th>
              <th data-sort="estimatedNav">估值/净值</th>
              <th data-sort="grossPremiumPct" class="sorted">溢价率</th>
              <th data-sort="marketPrice">场内价格</th>
              <th data-sort="turnoverYuan">成交额</th>
              <th data-sort="tradableEdgePct">可交易边际</th>
              <th data-sort="confidence">置信度</th>
              <th data-sort="levelRank">执行结论</th>
            </tr>
          </thead>
          <tbody id="fundTable"></tbody>
        </table>
      </section>
    </main>

    <script src="./src/data/mockFunds.js"></script>
    <script src="./src/data/apiClient.js"></script>
    <script src="./src/domain/formatters.js"></script>
    <script src="./src/ui/table.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
